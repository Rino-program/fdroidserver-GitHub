name: F-Droid CI/CD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 CIリポジトリのチェックアウト
        uses: actions/checkout@v4

      # 2. 本体アプリ側と全く同じ Java 21 (Temurin) をセットアップ
      - name: ☕ Java (JDK 21) のセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ⚙️ fdroidserver のインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx apksigner zlib1g-dev libjpeg-dev
          pipx install fdroidserver
          pipx inject fdroidserver "setuptools<82"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # gradlew-fdroid のダウンロードと配置
          SITE_PACKAGES=$(ls -d /opt/pipx/venvs/fdroidserver/lib/python*/site-packages)
          sudo git clone --depth 1 https://gitlab.com/fdroid/gradlew-fdroid.git /tmp/gradlew-fdroid
          sudo cp /tmp/gradlew-fdroid/gradlew* "$SITE_PACKAGES/"
          sudo chmod +x "$SITE_PACKAGES/gradlew-fdroid"

      # 3. F-Droid公式（および本体アプリのActions）と完全に同じ絶対パスのワークスペースを構築
      - name: 🛠️ F-Droid ワークスペースを絶対パスに構築
        run: |
          sudo mkdir -p /builds/Rino-program/fdroiddata
          sudo chown -R $USER:$USER /builds/
          cp -a $GITHUB_WORKSPACE/. /builds/Rino-program/fdroiddata/

      # 4. 作成した絶対パス側で F-Droid を初期化 (config.yml を使用)
      - name: 🛠️ F-Droid ワークスペースの初期化
        working-directory: /builds/Rino-program/fdroiddata
        run: |
          fdroid init

      # 5. 作成した絶対パス側でビルドを実行
      - name: 🚀 F-Droid ビルドの実行
        working-directory: /builds/Rino-program/fdroiddata
        run: |
          APP_ID="io.github.rinoprogram.audiovisualizer"
          echo "==== $APP_ID のビルドを開始します ===="
          fdroid build -v -l $APP_ID
